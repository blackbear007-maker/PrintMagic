# Railway service configuration for the multi-model AI service (Retinexformer, Real-ESRGAN, LaMa,
# rembg, YuNet). Keeps the legacy "zero-dce" directory/service name.
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/zero-dce/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Memory: set the Railway limit to match docker-compose.yml (4096M); measured ~837MB idle and
# ~2.26GB peak (see the notes there). CPU-only PyTorch (no GPU billing).
[[deploy.healthchecks]]
type = "HTTP"
path = "/health"
port = 8082
initialDelaySeconds = 20
periodSeconds = 30
timeoutSeconds = 15
failureThreshold = 3
