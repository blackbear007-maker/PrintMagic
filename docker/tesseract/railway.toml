# Railway service configuration for Tesseract OCR Microservice
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/tesseract/Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Memory ceiling: 384MB. Tesseract OCR with single-thread limit.
[[deploy.healthchecks]]
type = "HTTP"
path = "/health"
port = 8081
initialDelaySeconds = 15
periodSeconds = 30
timeoutSeconds = 10
failureThreshold = 3
