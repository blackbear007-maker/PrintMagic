##############################################################################
#  PrintMagic — Docker Compose (local dev)
#  RAM Ceilings below are enforced for `docker compose up` on this machine only.
#  ⚠️ They do NOT carry over to Railway: Railway deploys from each service's own
#     railway.toml (see docker/<service>/railway.toml), none of which set a memory
#     limit field — Railway's config-as-code schema doesn't expose one; limits there
#     are set via the Railway dashboard, outside this repo. So this file's comment
#     about "preventing Railway billing spikes" was true for local runs but didn't
#     actually constrain the Railway deployment the comment was about.
#

#  Monthly cost estimate (Railway, ACTUAL usage-based billing — corrected 2026-08-26):
#  ⚠️ Railway does NOT bill the `memory`/`cpus` numbers below — those are just OOM-kill / throttle
#     ceilings this compose file enforces for local dev. Railway meters and bills REAL consumption
#     per second: $10/GB-month for RAM ($0.00000386/GB-sec) and $20/vCPU-month for CPU
#     ($0.00000772/vCPU-sec), confirmed against railway.com/pricing on 2026-08-26. The table this
#     replaced multiplied the LIMIT column by a stale ~$5/GB rate — both mistakes (treating the
#     limit as if it were billed usage, and using half the real RAM rate) meant it overstated
#     zero-dce's true cost while never even asking whether printmagic/vtracer's CPU limits reflect
#     real usage (they don't — an idle Node/Rust process draws near-0% CPU, and usage-based billing
#     only charges for CPU actually consumed).
#
#  ┌──────────────────────┬────────────┬───────────┬───────────────────────────┐
#  │ Service               │ RAM Limit  │ CPU Limit │ $/mo est.                  │
#  ├──────────────────────┼────────────┼───────────┼───────────────────────────┤
#  │ printmagic (Node.js)  │ 256 MB     │ 0.5 vCPU  │ unverified — not measured  │
#  │                        │            │           │ this session; likely < $2 │
#  │ vtracer (Rust)         │ 128 MB     │ 0.3 vCPU  │ unverified — not measured  │
#  │                        │            │           │ this session; likely < $1 │
#  │ zero-dce (PyTorch)     │ 3,072 MB   │ 0.5 vCPU  │ ~$7-13 (MEASURED, see      │
#  │                        │            │           │ below)                     │
#  ├──────────────────────┼────────────┼───────────┼───────────────────────────┤
#  │ TOTAL                 │ 3,456 MB   │ 1.3 vCPU  │ ~$9-16/mo — zero-dce       │
#  │                        │            │           │ dominates; the other two   │
#  │                        │            │           │ were never independently   │
#  │                        │            │           │ measured, so treat their   │
#  │                        │            │           │ figures as rough upper     │
#  │                        │            │           │ bounds, not real data      │
#  └──────────────────────┴────────────┴───────────┴───────────────────────────┘
#
#  ⚠️ `zero-dce`'s RAM limit is 3072M as of 2026-08-26 (raised from 2048M once LaMa was added as
#     the 5th model — see docker/zero-dce/server.py's header comment: Retinexformer, Real-ESRGAN,
#     DehazeFormer-T, ARNIQA, and now LaMa). This limit is just the OOM ceiling, not the billed
#     amount — the real cost estimate above comes from ACTUALLY building the full dependency set
#     (including LaMa's 196MB big-lama.pt) in an isolated venv, running the real server.py as an
#     HTTP server, and hitting all 5 endpoints with real images while measuring RSS with psutil
#     (not a Docker container specifically — this repo has no way to build/run Docker images in the
#     environment these changes were authored in — but real PyTorch/basicsr/realesrgan/torch.hub/
#     torch.jit code, not simulated):
#       - All 5 models loaded, idle: 722.6 MB (vs. ~580 MB for the previous 4 — the +143MB delta is
#         LaMa's TorchScript graph resident in memory). 722.6MB × $10/GB-month ≈ $7.06/mo is the
#         cost FLOOR — what you pay even with zero traffic, just to keep the models warm.
#       - Steady-state after exercising all 5 endpoints once each (900x900 test images): ~1,330-
#         1,375 MB. Python/PyTorch's allocator doesn't release freed memory back to the OS, so a
#         lightly-used service realistically sits nearer this steady-state figure than the idle
#         floor — ~1.25GB × $10/GB-month ≈ $12.50/mo is the more realistic "actually gets some
#         traffic" estimate, hence the $7-13/mo range above.
#       - Peak observed across two full passes (10 total calls): 1,843.2 MB (hit during a /dehaze
#         call in the second pass) — this is a multi-SECOND spike, not sustained, so its billing
#         impact is small; it matters for the OOM ceiling (see 3072M reasoning below), not the
#         monthly estimate.
#       - CPU cost stays small even under real load, because it's billed per vCPU-second actually
#         consumed (capped at the 0.5 vCPU limit) rather than per request: at real measured per-call
#         latencies (/quality 1.1-1.3s, /dehaze 3.7-3.9s, /enhance 7.3-8.2s, /inpaint 8.6-9.8s,
#         /upscale 17-31s), even 5,000 requests/month spread across all 5 endpoints costs roughly
#         +$0.18/mo in CPU, and 50,000 requests/month roughly +$1.8/mo — the RAM floor above
#         dominates the bill far more than request volume does.
#       - The real risk under heavy CONCURRENT load isn't the bill — server.py uses a single-
#         threaded `http.server.HTTPServer` (not ThreadingHTTPServer), so requests to ANY endpoint
#         queue behind whichever one is currently running (e.g. a 30s /upscale call blocks /quality
#         too). If that queueing gets fixed by adding replicas, cost then scales roughly linearly
#         per replica — each one adds another ~$7-13/mo RAM floor, CPU stays cheap regardless.
#       - The previous note about a 2000x2000 input to Real-ESRGAN at tile=0 spiking to 2.2GB (why
#         /upscale caps input at ~1.44MP and uses tile=400) still applies unchanged; /inpaint (LaMa)
#         also has no equivalent large-input guard yet beyond the shared MAX_INPUT_PIXELS check —
#         worth revisiting if very large watermark-removal jobs become common.
#     3072M (1.5x the previous 2048M) leaves ~1.2GB of margin above the newly-observed 1.84GB peak
#     — deliberately larger headroom than before, since the 4-model measurement already showed
#     ±600MB of run-to-run variance between otherwise-identical runs on the SAME model count; a
#     smaller bump (e.g. 2560M) would leave only ~700MB margin, uncomfortably close to that already-
#     observed variance. Validate against production RSS on first real deploy regardless, since a
#     Linux container's allocator behavior can differ from this native Windows venv test.
#
#  ⚠️ OCR (Tesseract) was removed 2026-08-26 — it was never wired into any UI feature, and the
#     product need it was meant for (reading AI-hallucinated garbled "text" in generated artwork)
#     turns out to be unsolvable by OCR: that "text" usually isn't real characters at all, so no
#     OCR engine can meaningfully read it. See src/core/text-zone-detector.ts and
#     src/ui/vector-overlay-modal.ts for the actual approach (locate region, human types the
#     correct text, re-render as clean K100 vector text).
#
#  ⚠️  LanguageTool is NOT included here (JVM heap = $5-$15/mo risk).
#      Spellcheck is instead a local regex typo dictionary — see src/services/free-spellcheck-client.ts
#
#  Usage:
#    Local dev:  docker compose up
#    Railway:    Each service has its own railway.toml in docker/<service>/
##############################################################################

version: '3.9'

# Shared resource limit macro (reused via YAML anchors)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:

  # ── PrintMagic Main App (Node.js / Vite SSR) ──────────────────────────────
  printmagic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printmagic
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Microservice endpoints (internal Docker network)
      - VTRACER_URL=http://vtracer:8080
      - ZERO_DCE_URL=http://zero-dce:8082
    deploy:
      resources:
        limits:
          memory: 256M        # Hard ceiling — OOM-killed if exceeded
          cpus: '0.5'
        reservations:
          memory: 128M        # Guaranteed minimum
    healthcheck:
      # Fixed 2026-08-25: was "/health", which isn't a real route — the API is mounted at
      # /api (see server/index.ts), so a bare GET /health fell through to the SPA catch-all
      # and returned 200 regardless of whether the actual backend was healthy. This now hits
      # the real health route, matching what root railway.toml already used correctly.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - printmagic-net

  # ── VTracer SVG Vectorizer (Rust — ultra-light) ───────────────────────────
  vtracer:
    build:
      context: ./docker/vtracer
      dockerfile: Dockerfile
    container_name: vtracer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=warn
      - TOKIO_WORKER_THREADS=2
    deploy:
      resources:
        limits:
          memory: 128M        # Rust is lean — 128MB is generous
          cpus: '0.3'
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - printmagic-net

  # ── PyTorch CPU Vision Microservice (Retinexformer / Real-ESRGAN / DehazeFormer-T / ARNIQA / LaMa) ──
  zero-dce:
    build:
      context: ./docker/zero-dce
      dockerfile: Dockerfile
    container_name: zero-dce
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - OMP_NUM_THREADS=2    # CPU thread limit to prevent billing spike
      - TORCH_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    deploy:
      resources:
        limits:
          memory: 3072M       # Measured, not guessed — see header comment above (raised from 2048M
                               # when LaMa was added as the 5th model, 2026-08-26)
          cpus: '0.5'
        reservations:
          memory: 768M         # >= the measured 722.6MB idle baseline with all 5 models loaded
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s      # PyTorch model load needs extra warmup time
    logging: *default-logging
    networks:
      - printmagic-net

networks:
  printmagic-net:
    driver: bridge
