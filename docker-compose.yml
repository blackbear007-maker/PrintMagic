##############################################################################
#  PrintMagic — Docker Compose (local dev)
#  RAM Ceilings below are enforced for `docker compose up` on this machine only.
#  ⚠️ They do NOT carry over to Railway: Railway deploys from each service's own
#     railway.toml (see docker/<service>/railway.toml), none of which set a memory
#     limit field — Railway's config-as-code schema doesn't expose one; limits there
#     are set via the Railway dashboard, outside this repo. So this file's comment
#     about "preventing Railway billing spikes" was true for local runs but didn't
#     actually constrain the Railway deployment the comment was about.
#

#  ⚠️ STALE NOTICE (2026-08-27): DehazeFormer-T was evaluated and removed the same day (see
#     docs/SPEC.md's rejected-models section — dehaze's real addressable use case within this
#     app's typical print jobs turned out too narrow to justify keeping a dedicated model for it;
#     dehaze itself still works via the local ContrastDehazeFilter algorithm, just without the AI
#     tier). The measured figures below were taken WITH DehazeFormer-T loaded as one of "7 models"
#     — they have NOT been re-measured since its removal. Real current RAM/cost should be somewhat
#     LOWER than these numbers now (one fewer model resident), so treat this whole block as a
#     conservative upper bound, not current data, until it's actually re-measured.
#
#  Monthly cost estimate (Railway, ACTUAL usage-based billing — corrected 2026-08-26, updated for
#  the 7-model container 2026-08-27, since made stale by DehazeFormer-T's removal — see notice above):
#  ⚠️ Railway does NOT bill the `memory`/`cpus` numbers below — those are just OOM-kill / throttle
#     ceilings this compose file enforces for local dev. Railway meters and bills REAL consumption
#     per second: $10/GB-month for RAM ($0.00000386/GB-sec) and $20/vCPU-month for CPU
#     ($0.00000772/vCPU-sec), confirmed against railway.com/pricing on 2026-08-26.
#
#  ┌──────────────────────┬────────────┬───────────┬───────────────────────────┐
#  │ Service               │ RAM Limit  │ CPU Limit │ $/mo est.                  │
#  ├──────────────────────┼────────────┼───────────┼───────────────────────────┤
#  │ printmagic (Node.js)  │ 256 MB     │ 0.5 vCPU  │ unverified — not measured  │
#  │                        │            │           │ this session; likely < $2 │
#  │ vtracer (Rust)         │ 128 MB     │ 0.3 vCPU  │ unverified — not measured  │
#  │                        │            │           │ this session; likely < $1 │
#  │ zero-dce (PyTorch +    │ 4,096 MB   │ 0.5 vCPU  │ ~$8-17 (MEASURED, see      │
#  │   ONNX Runtime)        │            │           │ below)                     │
#  ├──────────────────────┼────────────┼───────────┼───────────────────────────┤
#  │ TOTAL                 │ 4,480 MB   │ 1.3 vCPU  │ ~$10-20/mo — zero-dce      │
#  │                        │            │           │ dominates; the other two   │
#  │                        │            │           │ were never independently   │
#  │                        │            │           │ measured, so treat their   │
#  │                        │            │           │ figures as rough upper     │
#  │                        │            │           │ bounds, not real data      │
#  └──────────────────────┴────────────┴───────────┴───────────────────────────┘
#
#  ⚠️ `zero-dce`'s RAM limit is 4096M as of 2026-08-27 (raised from 3072M once rembg/u2netp and
#     YuNet were added as the 6th/7th models — see docker/zero-dce/server.py's header comment;
#     DehazeFormer-T was the 3rd model added but was later evaluated and removed the same day, see
#     the stale notice above — current models: Retinexformer, Real-ESRGAN, ARNIQA, LaMa, rembg,
#     YuNet — the last two run on ONNX Runtime/OpenCV's DNN backend rather than PyTorch, a second
#     inference runtime sharing this same process). This limit is just the OOM ceiling, not the billed amount — the real cost
#     estimate above comes from ACTUALLY building the full dependency set (including rembg's ~4.6MB
#     u2netp.onnx and YuNet's ~0.23MB ONNX weight) in an isolated venv, running the real server.py
#     as an HTTP server, and hitting all 7 endpoints with real images while measuring RSS with
#     psutil (not a Docker container specifically — this repo has no way to build/run Docker images
#     in the environment these changes were authored in — but real PyTorch/basicsr/realesrgan/
#     torch.hub/torch.jit/onnxruntime code, not simulated):
#       - All 7 models loaded, idle: 837.2 MB (vs. 722.6 MB for the previous 5 — the +114.6MB delta
#         is rembg's u2netp ONNX session + YuNet's tiny ONNX session together, close to the 791.6MB
#         standalone figure measured for just those two in isolation, confirming they don't share
#         much baseline overhead with the PyTorch runtime). 837.2MB × $10/GB-month ≈ $8.18/mo is the
#         cost FLOOR — what you pay even with zero traffic, just to keep the models warm.
#       - Steady-state after exercising all 7 endpoints once each (900x900 test images, 640x640 for
#         /detect-face): 1,739.7 MB. Python/PyTorch/ONNX's allocators don't release freed memory
#         back to the OS, so a lightly-used service realistically sits nearer this steady-state
#         figure than the idle floor — ~1.70GB × $10/GB-month ≈ $17/mo is the more realistic
#         "actually gets some traffic" estimate, hence the $8-17/mo range above.
#       - Peak observed across two full passes (14 total calls): 2,258.5 MB (hit during an /enhance
#         call in the second pass) — this is a multi-SECOND spike, not sustained, so its billing
#         impact is small; it matters for the OOM ceiling (see 4096M reasoning below), not the
#         monthly estimate.
#       - CPU cost stays small even under real load, because it's billed per vCPU-second actually
#         consumed (capped at the 0.5 vCPU limit) rather than per request: at real measured per-call
#         latencies (/detect-face 0.03-0.05s, /matting 0.48-0.50s, /quality 1.0-1.1s, /dehaze
#         3.5-3.8s, /enhance 6.8-7.1s, /inpaint 7.9-8.0s, /upscale 15.8-16.1s), even 5,000
#         requests/month spread across all 7 endpoints costs roughly +$0.15/mo in CPU, and 50,000
#         requests/month roughly +$1.5/mo — the RAM floor above dominates the bill far more than
#         request volume does.
#       - The real risk under heavy CONCURRENT load isn't the bill — server.py uses a single-
#         threaded `http.server.HTTPServer` (not ThreadingHTTPServer), so requests to ANY endpoint
#         queue behind whichever one is currently running (e.g. a 16s /upscale call blocks the
#         50ms /detect-face call right behind it). If that queueing gets fixed by adding replicas,
#         cost then scales roughly linearly per replica — each one adds another ~$8-17/mo RAM
#         floor, CPU stays cheap regardless.
#       - The previous note about a 2000x2000 input to Real-ESRGAN at tile=0 spiking to 2.2GB (why
#         /upscale caps input at ~1.44MP and uses tile=400) still applies unchanged; /inpaint (LaMa)
#         and /matting (rembg) have no equivalent large-input guard beyond the shared
#         MAX_INPUT_PIXELS check — worth revisiting if very large images become common on either.
#     4096M leaves ~1.84GB of margin above the newly-observed 2.26GB peak — larger absolute
#     headroom than the previous 3072M ceiling's ~1.2GB margin over its own peak, since the safety
#     margin had shrunk to ~814MB right after adding the two new models (before this bump) — close
#     enough to the ±600MB run-to-run variance already observed between otherwise-identical runs on
#     the same model count that it was worth restoring real headroom rather than letting margin
#     erode with every model addition. Validate against production RSS on first real deploy
#     regardless, since a Linux container's allocator behavior can differ from this native Windows
#     venv test.
#
#  ⚠️ OCR (Tesseract) was removed 2026-08-26 — it was never wired into any UI feature, and the
#     product need it was meant for (reading AI-hallucinated garbled "text" in generated artwork)
#     turns out to be unsolvable by OCR: that "text" usually isn't real characters at all, so no
#     OCR engine can meaningfully read it. See src/core/text-zone-detector.ts and
#     src/ui/vector-overlay-modal.ts for the actual approach (locate region, human types the
#     correct text, re-render as clean K100 vector text).
#
#  ⚠️  LanguageTool is NOT included here (JVM heap = $5-$15/mo risk).
#      Spellcheck is instead a local regex typo dictionary — see src/services/free-spellcheck-client.ts
#
#  Usage:
#    Local dev:  docker compose up
#    Railway:    Each service has its own railway.toml in docker/<service>/
##############################################################################

version: '3.9'

# Shared resource limit macro (reused via YAML anchors)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:

  # ── PrintMagic Main App (Node.js / Vite SSR) ──────────────────────────────
  printmagic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: printmagic
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Microservice endpoints (internal Docker network)
      - VTRACER_URL=http://vtracer:8080
      - ZERO_DCE_URL=http://zero-dce:8082
    deploy:
      resources:
        limits:
          memory: 256M        # Hard ceiling — OOM-killed if exceeded
          cpus: '0.5'
        reservations:
          memory: 128M        # Guaranteed minimum
    healthcheck:
      # Fixed 2026-08-25: was "/health", which isn't a real route — the API is mounted at
      # /api (see server/index.ts), so a bare GET /health fell through to the SPA catch-all
      # and returned 200 regardless of whether the actual backend was healthy. This now hits
      # the real health route, matching what root railway.toml already used correctly.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - printmagic-net

  # ── VTracer SVG Vectorizer (Rust — ultra-light) ───────────────────────────
  vtracer:
    build:
      context: ./docker/vtracer
      dockerfile: Dockerfile
    container_name: vtracer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=warn
      - TOKIO_WORKER_THREADS=2
    deploy:
      resources:
        limits:
          memory: 128M        # Rust is lean — 128MB is generous
          cpus: '0.3'
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - printmagic-net

  # ── PyTorch/ONNX CPU Vision Microservice (Retinexformer / Real-ESRGAN / ARNIQA / LaMa / rembg / YuNet) ──
  zero-dce:
    build:
      context: ./docker/zero-dce
      dockerfile: Dockerfile
    container_name: zero-dce
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - OMP_NUM_THREADS=2    # CPU thread limit to prevent billing spike
      - TORCH_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    deploy:
      resources:
        limits:
          memory: 4096M       # Measured, not guessed — see header comment above (raised from 3072M
                               # when rembg and YuNet were added as the 6th/7th models, 2026-08-27)
          cpus: '0.5'
        reservations:
          memory: 896M          # >= the measured 837.2MB idle baseline with all 7 models loaded
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s      # PyTorch model load needs extra warmup time
    logging: *default-logging
    networks:
      - printmagic-net

networks:
  printmagic-net:
    driver: bridge
